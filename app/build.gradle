plugins {
    id "com.android.application"
}

android {
    namespace "com.paneldeck.aida"
    compileSdk 35

    defaultConfig {
        applicationId "com.paneldeck.aida"
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName "2.8.1"
        testInstrumentationRunner(project.findProperty("themeSyncTest") == "true"
                ? "com.paneldeck.aida.ThemeSyncInstrumentation" : "com.paneldeck.aida.ThemeUiInstrumentation")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ["../panel"] } }
}
